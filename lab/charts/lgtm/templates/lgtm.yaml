apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lgtm-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels: {app: lgtm}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: lgtm}
  template:
    metadata:
      labels: {app: lgtm}
    spec:
      containers:
        - name: lgtm
          image: {{ .Values.image }}
          env:
            # Loki's pattern ingester is off by default; the demo needs it.
            - {name: LOKI_EXTRA_ARGS, value: "-pattern-ingester.enabled=true"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer"}
            - {name: GF_SECURITY_ADMIN_USER, value: "admin"}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: {{ .Values.grafanaAdminPassword | quote }}}
            - {name: GF_SERVER_ROOT_URL, value: "http://localhost:3000"}
          ports:
            - {name: grafana, containerPort: 3000}
            - {name: prometheus, containerPort: 9090}
            - {name: loki, containerPort: 3100}
            - {name: tempo, containerPort: 3200}
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
          readinessProbe:
            exec: {command: ["sh", "-c", "test -f /tmp/ready"]}
            periodSeconds: 5
          resources:
            requests: {memory: 2Gi, cpu: "1"}
            limits: {memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: lgtm-data}
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  type: NodePort
  selector: {app: lgtm}
  ports:
    - {name: grafana, port: 3000, targetPort: 3000, nodePort: {{ .Values.nodePorts.grafana }}}
    - {name: prometheus, port: 9090, targetPort: 9090, nodePort: {{ .Values.nodePorts.prometheus }}}
    - {name: loki, port: 3100, targetPort: 3100, nodePort: {{ .Values.nodePorts.loki }}}
    - {name: tempo, port: 3200, targetPort: 3200, nodePort: {{ .Values.nodePorts.tempo }}}
    - {name: otlp-http, port: 4318, targetPort: 4318, nodePort: {{ .Values.nodePorts.otlpHttp }}}
    - {name: otlp-grpc, port: 4317, targetPort: 4317}

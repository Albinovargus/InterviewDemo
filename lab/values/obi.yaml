# OBI network preset: records pod-to-pod connections with Kubernetes owners,
# whether or not the workload is instrumented. Exports OTLP to otel-lgtm.
preset: network
config:
  data:
    file_format: "1.0"
    log_level: info
    extensions:
      obi:
        version: "2.0"
        capture:
          network:
            capture:
              enabled: true
              filters:
                metrics: &filters
                  k8s_src_owner_name:
                    not_match: '{kube*,*prometheus*,*grafana-agent*}'
                  k8s_dst_owner_name:
                    not_match: '{kube*,*prometheus*,*grafana-agent*}'
                traces: *filters
        enrich:
          enrichers:
            kubernetes:
              mode: enabled
    meter_provider:
      readers:
        - periodic:
            interval: 15000
            exporter:
              otlp_http:
                encoding: protobuf
                endpoint: http://lgtm.observability.svc.cluster.local:4318
    tracer_provider:
      processors:
        - batch:
            exporter:
              otlp_grpc:
                endpoint: http://lgtm.observability.svc.cluster.local:4317
                tls:
                  insecure: true
            schedule_delay: 15000

# OpenTelemetry Demo 0.42.6 (app 3.1.0). Bundled backends are off; the demo's
# collector forwards everything to otel-lgtm, which stands in for the existing stack.
jaeger: {enabled: false}
prometheus: {enabled: false}
grafana: {enabled: false}
opensearch: {enabled: false}

components:
  # LLM-backed extras: not part of the shop, and they would need an LLM key.
  agent: {enabled: false}
  chatbot: {enabled: false}
  mcp: {enabled: false}
  telemetry-docs: {enabled: false}
  load-generator:
    # 25 simulated shoppers (chart default 5): every service, including payment
    # and checkout, then sees steady traffic, so error-rate alerts do not flap.
    envOverrides:
      - {name: LOCUST_USERS, value: "25"}
    resources: {limits: {memory: 2500Mi}}
  # Chart limits are sized for 5 users; at 25 these sat at 80-88% of their limit,
  # so MemoryNearLimit fired with no fault. Headroom keeps that alert meaningful.
  accounting:
    resources: {limits: {memory: 400Mi}}
  kafka:
    resources: {limits: {memory: 1200Mi}}
  fraud-detection:
    resources: {limits: {memory: 600Mi}}
  ad:
    resources: {limits: {memory: 600Mi}}
  frontend-proxy:
    service:
      type: NodePort
      nodePort: 30080

opentelemetry-collector:
  config:
    receivers:
      # kind's kubelet serves a self-signed certificate.
      kubeletstats:
        insecure_skip_verify: true
    exporters:
      otlp_http/lgtm:
        endpoint: http://lgtm.observability.svc.cluster.local:4318
        tls: {insecure: true}
        sending_queue:
          batch: {}
    service:
      pipelines:
        traces:
          exporters: [otlp_http/lgtm]
        metrics:
          receivers: [otlp, kafkametrics, prometheus/ad]
          exporters: [otlp_http/lgtm]
        logs:
          exporters: [otlp_http/lgtm]
        profiles:
          exporters: [debug]

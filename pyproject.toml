[project]
name = "noc"
version = "0.1.0"
description = "Blast Radius: AI-assisted NOC demo (map builder, reduction MCP server, fault controller, console)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=1.20",
  "httpx>=0.28",
  "starlette>=0.48",
  "uvicorn>=0.38",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noc"]
